<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package Listing</title>
  <meta name="description" content="A listing of packages with install commands and download links." />

  <!-- Open Graph / link-preview metadata -->
  <meta property="og:title" content="Package Listing" />
  <meta property="og:description" content="A listing of packages with install commands and download links." />
  <meta property="og:type" content="website" />

  <!-- Fonts: General Sans (body) + JetBrains Mono (code) -->
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root,
    [data-theme='light'] {
      --color-bg: #f7f6f2;
      --color-surface: #ffffff;
      --color-surface-offset: #f3f0ec;
      --color-border: #e2ded7;
      --color-divider: #ece9e4;

      --color-text: #1f1d18;
      --color-text-muted: #6b6862;
      --color-text-faint: #a8a59f;

      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-highlight: #e3efed;

      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 6px 20px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 18px 48px oklch(0.2 0.01 80 / 0.12);
    }

    [data-theme='dark'] {
      --color-bg: #15140f;
      --color-surface: #1c1a15;
      --color-surface-offset: #211e18;
      --color-border: #34302a;
      --color-divider: #2a2722;

      --color-text: #d8d4ca;
      --color-text-muted: #8a857c;
      --color-text-faint: #5d5a52;

      --color-primary: #5fb0b6;
      --color-primary-hover: #4ea3a9;
      --color-primary-highlight: #1e2a29;

      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
      --shadow-md: 0 6px 20px oklch(0 0 0 / 0.35);
      --shadow-lg: 0 18px 48px oklch(0 0 0 / 0.45);
    }

    /* Base */
    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      line-height: 1.6;
      font-family: 'General Sans', system-ui, -apple-system, sans-serif;
      font-size: clamp(1rem, 0.96rem + 0.2vw, 1.0625rem);
      color: var(--color-text);
      background-color: var(--color-bg);
      background-image:
        radial-gradient(circle at 12% -10%, color-mix(in oklab, var(--color-primary) 8%, transparent), transparent 45%);
      background-attachment: fixed;
    }

    img, svg { display: block; max-width: 100%; height: auto; }
    a { color: var(--color-primary); transition: color 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    a:hover { color: var(--color-primary-hover); }

    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }

    ::selection {
      background: color-mix(in oklab, var(--color-primary) 25%, transparent);
      color: var(--color-text);
    }

    /* Layout */
    .page {
      max-width: 760px;
      margin-inline: auto;
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.25rem, 5vw, 2rem) 6rem;
      display: flex;
      flex-direction: column;
      gap: clamp(1.25rem, 4vw, 2rem);
    }

    /* Page header */
    .page-head {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--color-text-muted);
      text-decoration: none;
    }
    .brand:hover { color: var(--color-text); }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--color-primary);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      color: var(--color-text-muted);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: color 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .theme-toggle:hover { color: var(--color-text); border-color: var(--color-text-faint); }

    .page-title {
      font-size: clamp(1.5rem, 1rem + 2vw, 2rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .page-sub {
      font-size: 0.9375rem;
      color: var(--color-text-muted);
      max-width: 60ch;
    }

    /* Entry list */
    .entries {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      list-style: none;
    }

    /* ── ENTRY CARD ──
       Each <li class="entry"> is a self-contained block.
       Copy everything between <!-- ENTRY START --> and <!-- ENTRY END -->
       and paste it inside <ul class="entries"> to add a new package. */
    .entry {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: clamp(1.25rem, 4vw, 1.75rem);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .entry-head { display: flex; flex-direction: column; gap: 0.625rem; }

    .entry-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      background: var(--color-primary-highlight);
      color: var(--color-primary);
      border: 1px solid color-mix(in oklab, var(--color-primary) 20%, transparent);
    }
    .badge.neutral {
      background: var(--color-surface-offset);
      color: var(--color-text-muted);
      border-color: var(--color-border);
    }

    .entry-title {
      font-size: clamp(1.25rem, 1rem + 1vw, 1.5rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.015em;
    }

    .entry-desc {
      font-size: 0.9375rem;
      color: var(--color-text-muted);
      max-width: 62ch;
    }

    /* Install command */
    .install { display: flex; flex-direction: column; gap: 0.5rem; }

    .install-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-faint);
    }

    .cmd {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0.875rem;
      background: var(--color-surface-offset);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.875rem;
      color: var(--color-text);
    }

    .cmd-prompt { color: var(--color-text-faint); user-select: none; }
    .cmd-text { flex: 1; overflow-x: auto; white-space: nowrap; }
    .cmd-text::-webkit-scrollbar { height: 0; }

    .copy-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.35rem 0.625rem;
      font-size: 0.75rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--color-text-muted);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      cursor: pointer;
      transition: color 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .copy-btn:hover { color: var(--color-text); border-color: var(--color-text-faint); }
    .copy-btn.copied { color: var(--color-primary); border-color: var(--color-primary); }

    /* Actions */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 180ms cubic-bezier(0.16, 1, 0.3, 1), color 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms cubic-bezier(0.16, 1, 0.3, 1), transform 120ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border: 1px solid var(--color-primary);
    }
    .btn-primary:hover { background: var(--color-primary-hover); color: #fff; }

    .btn-ghost {
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }
    .btn-ghost:hover { border-color: var(--color-text-faint); }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-text-faint);
      padding-top: 0.5rem;
    }
    .footer a { color: var(--color-text-muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- ═══════════════════════════════════════════════
         PAGE HEADER — edit the title/subtitle here
         ═══════════════════════════════════════════════ -->
    <header class="page-head">
      <div class="topbar">
        <a class="brand" href="https://github.com/your-username" aria-label="GitHub profile">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 2 7l10 5 10-5-10-5Z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
          </span>
          Your Name
        </a>

        <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </button>
      </div>

      <h1 class="page-title">Packages</h1>
      <p class="page-sub">A listing of my projects with install commands and download links.</p>
    </header>

    <!-- ═══════════════════════════════════════════════
         PACKAGE ENTRIES
         ──────────────
         To add a new package, copy ONE entire block from
         ENTRY START to ENTRY END (the comment markers
         around each li.entry below) and paste it anywhere
         inside the ul.entries list. Then edit the title,
         description, badges, install command, and links.
         ═══════════════════════════════════════════════ -->
    <ul class="entries">

      <!-- ────────────────────────────────────────
           ENTRY START — copy from here…
           ──────────────────────────────────────── -->
      <li class="entry">
        <div class="entry-head">
          <div class="entry-meta">
            <span class="badge">v1.0.0</span>
            <span class="badge neutral">MIT</span>
            <span class="badge neutral">Bash</span>
          </div>

          <h2 class="entry-title">Example</h2>
          <p class="entry-desc">
            Example description
          </p>
        </div>

        <div class="install">
          <span class="install-label">Install</span>
          <div class="cmd">
            <span class="cmd-prompt">$</span>
            <code class="cmd-text">auro repo ****</code>
            <button class="copy-btn" data-copy aria-label="Copy install command">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              <span class="copy-label">Copy</span>
            </button>
          </div>
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="https://example.com">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download .ikeg
          </a>
          <a class="btn btn-primary" href="https://example.com">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download .keg
          </a>
          <a class="btn btn-ghost" href="https://example.com">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.4-2.7 5.4-5.3 5.7.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5Z" />
            </svg>
            Source
          </a>
        </div>
      </li>
      <!-- ────────────────────────────────────────
           …to here. Paste below to add another entry.
           ENTRY END
           ──────────────────────────────────────── -->

</ul>

    <footer class="footer">
      Released under their respective licenses ·
      <a href="https://github.com/">GitHub</a>
    </footer>
  </main>

  <script>
    // Theme toggle
    (function () {
      var root = document.documentElement;
      var toggle = document.querySelector('[data-theme-toggle]');
      var current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', current);

      function icon(theme) {
        return theme === 'dark'
          ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>'
          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5" /><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" /></svg>';
      }
      toggle.innerHTML = icon(current);
      toggle.setAttribute('aria-label', 'Switch to ' + (current === 'dark' ? 'light' : 'dark') + ' mode');

      toggle.addEventListener('click', function () {
        current = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', current);
        toggle.innerHTML = icon(current);
        toggle.setAttribute('aria-label', 'Switch to ' + (current === 'dark' ? 'light' : 'dark') + ' mode');
      });
    })();

    // Copy to clipboard — works for every [data-copy] button on the page
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var text = btn.closest('.cmd').querySelector('.cmd-text').textContent.trim();
        var label = btn.querySelector('.copy-label');
        var original = label ? label.textContent : '';
        navigator.clipboard.writeText(text).then(function () {
          btn.classList.add('copied');
          if (label) label.textContent = 'Copied';
          setTimeout(function () {
            btn.classList.remove('copied');
            if (label) label.textContent = original;
          }, 1800);
        });
      });
    });
  </script>
</body>
</html>
